services:
  news-parcer:
    build: .
    container_name: news-parcer
    restart: unless-stopped
    env_file:
      - .env
    environment:
      - SEEN_POSTS_FILE=/app/data/seen_posts.json
      - MALLOC_ARENA_MAX=2
      - PYTHONOPTIMIZE=1
    deploy:
      resources:
        limits:
          memory: 256M
    volumes:
      - news-data:/app/data

volumes:
  news-data:
    name: news-parcer-data
